<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regtank Exchange API · Swagger UI</title>
    <meta name="description" content="Regtank Exchange API — Swagger UI with Try-It (demo by SPXpay)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
    <style>
      :root { --banner-h: 36px; }
      html, body { margin: 0; background: #fafafa; }
      .demo-banner {
        position: sticky; top: 0; z-index: 100;
        height: var(--banner-h);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px;
        background: linear-gradient(90deg, #0d1117 0%, #161b22 100%);
        color: #c9d1d9;
        font: 12px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
        border-bottom: 1px solid #30363d;
      }
      .demo-banner a { color: #58a6ff; text-decoration: none; margin-left: 12px; }
      .demo-banner a:hover { text-decoration: underline; }
      .demo-banner .pill {
        background: #4caf50; color: white; padding: 2px 8px;
        border-radius: 12px; font-weight: 600; margin-right: 8px;
      }
      #swagger-ui { padding-top: 8px; }
      .swagger-ui .topbar { display: none; }
    </style>
  </head>
  <body>
    <div class="demo-banner">
      <div>
        <span class="pill">C · Swagger UI</span>
        Regtank Exchange API · classic OpenAPI explorer with Try-It
      </div>
      <div>
        <a href="../../">← All variants</a>
        <a href="../../spec/regtank-exchange.yaml" target="_blank">spec.yaml</a>
      </div>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: '../../spec/regtank-exchange.yaml',
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset,
          ],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: 'StandaloneLayout',
          docExpansion: 'list',
          defaultModelsExpandDepth: 2,
          defaultModelExpandDepth: 2,
          tryItOutEnabled: true,
          persistAuthorization: true,
          syntaxHighlight: { theme: 'monokai' },
        });
      };
    </script>
  </body>
</html>
