<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regtank Exchange API · Scalar</title>
    <meta name="description" content="Regtank Exchange API — Scalar-rendered interactive docs (demo by SPXpay)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>" />
    <style>
      :root { --scalar-custom-header-height: 36px; }
      body { margin: 0; }
      .demo-banner {
        position: sticky; top: 0; z-index: 100;
        height: var(--scalar-custom-header-height);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px;
        background: linear-gradient(90deg, #0d1117 0%, #161b22 100%);
        color: #c9d1d9;
        font: 12px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
        border-bottom: 1px solid #30363d;
      }
      .demo-banner a { color: #58a6ff; text-decoration: none; margin-left: 12px; }
      .demo-banner a:hover { text-decoration: underline; }
      .demo-banner .pill {
        background: #1f6feb; color: white; padding: 2px 8px;
        border-radius: 12px; font-weight: 600; margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div class="demo-banner">
      <div>
        <span class="pill">A · Scalar</span>
        Regtank Exchange API · interactive demo
      </div>
      <div>
        <a href="../../">← All variants</a>
        <a href="../../spec/regtank-exchange.yaml" target="_blank">spec.yaml</a>
      </div>
    </div>

    <script
      id="api-reference"
      data-url="../../spec/regtank-exchange.yaml"
      data-proxy-url=""
    ></script>
    <script>
      var configuration = {
        theme: 'purple',
        layout: 'modern',
        showSidebar: true,
        hideDownloadButton: false,
        searchHotKey: 'k',
        metaData: {
          title: 'Regtank Exchange API',
          description: 'KYC / KYB / KYT screening — interactive Scalar docs (demo)',
        },
        customCss: `
          .scalar-app { --scalar-header-height: 36px; }
        `,
      };
      document.getElementById('api-reference').dataset.configuration =
        JSON.stringify(configuration);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
