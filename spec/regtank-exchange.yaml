openapi: 3.1.0
info:
  title: Regtank Exchange API
  version: "1.13"
  summary: KYC, KYB and KYT screening service for compliance teams
  description: |
    The **Regtank Exchange API** lets you submit individuals (KYC), businesses (KYB)
    and crypto transactions (KYT) for sanctions, PEP and adverse-media screening,
    and receive results through both polling and webhook delivery.

    ## Quickstart

    1. Obtain a `client_id` / `client_secret` pair from Regtank support.
    2. Exchange them for an `access_token` via [`POST /oauth/token`](#tag/Authentication).
    3. Submit a screening request to one of the `*/exchange/input` endpoints
       (`v2` returns a `systemId` you can poll).
    4. Poll the matching `*/exchange/query` endpoint with `systemId` or
       `referenceId`, **or** configure a webhook callback URL to be pushed updates.

    ## Two server hosts

    Regtank operates two hosts:

    | Purpose | Host |
    |---|---|
    | Issue OAuth2 tokens | `crm-server.regtank.com` |
    | Submit screening jobs / query results | `{tenant}-server.regtank.com` (per-customer) |

    Use the OAuth host only for `/oauth/token`; everything else hits your
    customer-specific portal host.

    ## Why `v2`?

    `v2` of every `*/exchange/input` endpoint returns the `systemId` directly in
    the body. With `v1` you only get a `200 OK` and must look the record up by
    `referenceId`. **New integrations should use `v2`.**
  contact:
    name: Regtank Support
    url: https://regtank.com
    email: support@regtank.com
  license:
    name: Regtank Private & Confidential
servers:
  - url: https://crm-server.regtank.com
    description: Production — OAuth token endpoint only
  - url: https://crm-staging-server.regtank.com
    description: Staging — OAuth token endpoint only
  - url: https://{tenant}-server.regtank.com
    description: Production — per-tenant Exchange API host
    variables:
      tenant:
        default: spxpay
        description: Your company subdomain (provided at onboarding)
  - url: https://{tenant}-staging-server.regtank.com
    description: Staging — per-tenant Exchange API host
    variables:
      tenant:
        default: spxpay
        description: Your company subdomain (provided at onboarding)

tags:
  - name: Authentication
    description: |
      All Exchange API calls require an OAuth2 access token.
      Tokens are valid for one hour — refresh proactively.
  - name: KYC (Acuris)
    description: |
      Screen an individual against Acuris (formerly C6) PEP, sanctions and
      adverse-media lists.
  - name: KYC (Dow Jones)
    description: |
      Screen an individual against Dow Jones Risk & Compliance data.
      Same shape as Acuris KYC, but on a separate database.
  - name: KYB
    description: |
      Screen a business — looks up the entity and its UBOs / directors / shareholders.
  - name: KYT
    description: |
      Screen a crypto wallet address against transaction-graph risk data.
      Supports BTC, BCH, BNB, LTC, ETH.
  - name: Webhooks
    description: |
      Configure a callback URL in the Regtank portal to receive push updates
      when a record changes status, hits a new sanctions list, or shows a new
      on-chain transaction.

paths:
  /oauth/token:
    post:
      tags: [Authentication]
      summary: Exchange client credentials for an access token
      description: |
        Exchange your `client_id` / `client_secret` for an OAuth2 access token.
        Tokens are JWT bearer tokens valid for **1 hour**.

        Send the body as either `application/x-www-form-urlencoded` or as a
        query string — both are accepted.
      operationId: getAccessToken
      security: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST https://crm-server.regtank.com/oauth/token \
              -d "grant_type=client_credentials" \
              -d "client_id=$REGTANK_CLIENT_ID" \
              -d "client_secret=$REGTANK_CLIENT_SECRET"
        - lang: Python
          source: |
            import os, requests

            tok = requests.post(
                "https://crm-server.regtank.com/oauth/token",
                data={
                    "grant_type": "client_credentials",
                    "client_id": os.environ["REGTANK_CLIENT_ID"],
                    "client_secret": os.environ["REGTANK_CLIENT_SECRET"],
                },
            ).json()
            access_token = tok["access_token"]
        - lang: JavaScript
          source: |
            const tok = await fetch('https://crm-server.regtank.com/oauth/token', {
              method: 'POST',
              body: new URLSearchParams({
                grant_type: 'client_credentials',
                client_id: process.env.REGTANK_CLIENT_ID,
                client_secret: process.env.REGTANK_CLIENT_SECRET,
              }),
            }).then(r => r.json());
        - lang: Java
          source: |
            HttpRequest req = HttpRequest.newBuilder()
                .uri(URI.create("https://crm-server.regtank.com/oauth/token"))
                .POST(BodyPublishers.ofString(
                    "grant_type=client_credentials"
                    + "&client_id=" + System.getenv("REGTANK_CLIENT_ID")
                    + "&client_secret=" + System.getenv("REGTANK_CLIENT_SECRET")))
                .build();
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              clientCredentials:
                summary: Client credentials grant
                value:
                  grant_type: client_credentials
                  client_id: a2801714-0e34-4fbb-be74-30e25c544b73
                  client_secret: e5555bcff97f86a4d17209443a6456b5
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                success:
                  value:
                    access_token: eyJhbGciOiJSUzI1NiIs...
                    token_type: bearer
                    expires_in: 3599
                    scope: read write
                    sub: a2801714-0e34-4fbb-be74-30e25c544b73
                    jti: f518893b-b4ca-4ad1-8a7a-dd5c5524d909
        "400":
          $ref: "#/components/responses/BadRequest"
          content:
            application/json:
              examples:
                badCredentials:
                  summary: Missing client_secret
                  value:
                    error: invalid_client
                    error_description: Bad client credentials
                badGrant:
                  summary: Unsupported grant type
                  value:
                    error: unsupported_grant_type
                    error_description: "Unsupported grant type: notclient_credentials"

  /v1/kyc/exchange/input:
    post:
      tags: [KYC (Acuris)]
      summary: Submit a KYC screening (v1, legacy)
      description: |
        Submit an individual for Acuris KYC screening.

        > **Use `v2` for new integrations** — it returns the `systemId` directly,
        > which `v1` does not.
      operationId: submitKycV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycRequest"
            examples:
              minimal:
                value:
                  surname: Smith
                  forename: John
                  enableReScreening: true
      responses:
        "200":
          description: Request accepted — query later by `referenceId`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v2/kyc/exchange/input:
    post:
      tags: [KYC (Acuris)]
      summary: Submit a KYC screening (v2, recommended)
      description: |
        Submit an individual for Acuris KYC screening. **Recommended.**

        Returns the `systemId` immediately so you can poll for results without
        also needing a `referenceId`.
      operationId: submitKycV2
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST https://$TENANT-server.regtank.com/v2/kyc/exchange/input \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "surname": "Smith",
                "forename": "John",
                "dateOfBirth": "1980-09-30",
                "nationality": "US",
                "referenceId": "user-001",
                "enableOnGoingMonitoring": true
              }'
            # → KYC00121
        - lang: Python
          source: |
            system_id = requests.post(
                f"https://{tenant}-server.regtank.com/v2/kyc/exchange/input",
                headers={"Authorization": f"Bearer {token}"},
                json={
                    "surname": "Smith",
                    "forename": "John",
                    "dateOfBirth": "1980-09-30",
                    "nationality": "US",
                    "referenceId": "user-001",
                    "enableOnGoingMonitoring": True,
                },
            ).text
            # "KYC00121"
        - lang: JavaScript
          source: |
            const systemId = await fetch(
              `https://${tenant}-server.regtank.com/v2/kyc/exchange/input`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  surname: 'Smith',
                  forename: 'John',
                  referenceId: 'user-001',
                  enableOnGoingMonitoring: true,
                }),
              },
            ).then(r => r.text());
            // "KYC00121"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycRequest"
            examples:
              full:
                summary: Full request with all fields
                value:
                  surname: Smith
                  middlename: Junior
                  forename: John
                  gender: MALE
                  enableReScreening: false
                  enableOnGoingMonitoring: false
                  dateOfBirth: "1980-09-30"
                  assignee: admin@regtank.com
                  address1: 21 Ang Mo Kio St
                  address2: 13-25
                  countryOfResidence: SG
                  email: john.smith@abc.com
                  governmentIdNumber: A4059456
                  idIssuingCountry: US
                  nationality: US
                  phone: "+65-98504563"
                  placeOfBirth: US
                  referenceId: john.smith@abc.com
                  yearOfBirth: 1980
      responses:
        "200":
          description: Returns the assigned `systemId`.
          content:
            text/plain:
              schema:
                type: string
                example: KYC00121
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/kyc/exchange/query:
    get:
      tags: [KYC (Acuris)]
      summary: Query a KYC record
      description: |
        Fetch a KYC record by `systemId`, `referenceId`, or both.
        At least one of the two parameters is required.

        If both are supplied, the result is the **intersection** —
        records that match both.
      operationId: queryKyc
      parameters:
        - name: systemId
          in: query
          schema: { type: string, example: KYC00001 }
        - name: referenceId
          in: query
          schema: { type: string, example: john.smith@example.com }
      responses:
        "200":
          description: List of matching KYC records (empty list if no match).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KycRecord" }
        "400":
          description: Both `systemId` and `referenceId` empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                status: BAD_REQUEST
                message: Either Reference ID or System ID required.
                error_code: 400
                timestamp: "2026-02-05T08:47:20.820+00:00"
                path: /v1/kyc/exchange/query
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/djkyc/exchange/input:
    post:
      tags: [KYC (Dow Jones)]
      summary: Submit a Dow Jones KYC screening (v1, legacy)
      description: |
        Screen an individual against the **Dow Jones Risk & Compliance**
        dataset. Same fields as Acuris KYC.
      operationId: submitDjKycV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycRequest"
      responses:
        "200": { description: Request accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v2/djkyc/exchange/input:
    post:
      tags: [KYC (Dow Jones)]
      summary: Submit a Dow Jones KYC screening (v2, recommended)
      description: Returns `systemId` (prefixed `DJKYC`) directly.
      operationId: submitDjKycV2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycRequest" }
      responses:
        "200":
          description: Returns the assigned `systemId`.
          content:
            text/plain:
              schema: { type: string, example: DJKYC00121 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/djkyc/exchange/query:
    get:
      tags: [KYC (Dow Jones)]
      summary: Query a Dow Jones KYC record
      description: |
        Same semantics as `/v1/kyc/exchange/query` — pass at least one of
        `systemId` (prefixed `DJKYC`) or `referenceId`.
      operationId: queryDjKyc
      parameters:
        - name: systemId
          in: query
          schema: { type: string, example: DJKYC00001 }
        - name: referenceId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching DJKYC records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KycRecord" }

  /v1/kyt/exchange/input:
    post:
      tags: [KYT]
      summary: Submit a KYT screening (v1, legacy)
      operationId: submitKytV1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KytRequest" }
      responses:
        "200": { description: Request accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v2/kyt/exchange/input:
    post:
      tags: [KYT]
      summary: Submit a KYT screening (v2, recommended)
      description: |
        Submit a crypto wallet address for transaction-graph risk screening.

        Supports `BTC`, `BCH`, `BNB`, `LTC`, `ETH`.
      operationId: submitKytV2
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST https://$TENANT-server.regtank.com/v2/kyt/exchange/input \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "asset": "BTC",
                "address": "3Pv7L9EeYyAMcn7U3tTWyKWxFpVJHfQBTa",
                "referenceId": "user-001",
                "ongoingMonitoring": { "riskScoreChange": true, "newTransaction": true },
                "webHookResponse": true
              }'
            # → KYT00011
        - lang: Python
          source: |
            requests.post(
                f"https://{tenant}-server.regtank.com/v2/kyt/exchange/input",
                headers={"Authorization": f"Bearer {token}"},
                json={
                    "asset": "BTC",
                    "address": "3Pv7L9EeYyAMcn7U3tTWyKWxFpVJHfQBTa",
                    "referenceId": "user-001",
                    "ongoingMonitoring": {"riskScoreChange": True, "newTransaction": True},
                    "webHookResponse": True,
                },
            ).text  # "KYT00011"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KytRequest" }
            examples:
              btc:
                summary: BTC address
                value:
                  asset: BTC
                  address: 3Pv7L9EeYyAMcn7U3tTWyKWxFpVJHfQBTa
                  referenceId: john.smith@example.com
                  assignee: peter.lee@compliance.com
                  ongoingMonitoring:
                    riskScoreChange: true
                    newTransaction: true
                  webHookResponse: true
      responses:
        "200":
          description: Returns the assigned `systemId` (prefixed `KYT`).
          content:
            text/plain:
              schema: { type: string, example: KYT00011 }
        "400":
          description: Bad request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                status: BAD_REQUEST
                message: INVALID_PARAMETERS
                error_code: 400
                timestamp: "2026-02-05T08:47:20.820+00:00"
                errors:
                  asset: This field is required
                  kytInputDto: Invalid Wallet Address

  /v1/kyt/exchange/query:
    get:
      tags: [KYT]
      summary: Query a KYT record
      operationId: queryKyt
      parameters:
        - name: systemId
          in: query
          schema: { type: string, example: KYT00001 }
        - name: referenceId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching KYT records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KytRecord" }

  /v1/kyb/exchange/input:
    post:
      tags: [KYB]
      summary: Submit a KYB screening (v1, legacy)
      operationId: submitKybV1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KybRequest" }
      responses:
        "200": { description: Request accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v2/kyb/exchange/input:
    post:
      tags: [KYB]
      summary: Submit a KYB screening (v2, recommended)
      description: Screen a business entity and its associated parties.
      operationId: submitKybV2
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST https://$TENANT-server.regtank.com/v2/kyb/exchange/input \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "entityName": "ACME Capital Pte Ltd",
                "registrationNumber": "201912345A",
                "countryOfRegistration": "SG",
                "referenceId": "acme-001"
              }'
            # → KYB00212
        - lang: Python
          source: |
            requests.post(
                f"https://{tenant}-server.regtank.com/v2/kyb/exchange/input",
                headers={"Authorization": f"Bearer {token}"},
                json={
                    "entityName": "ACME Capital Pte Ltd",
                    "registrationNumber": "201912345A",
                    "countryOfRegistration": "SG",
                    "referenceId": "acme-001",
                },
            ).text  # "KYB00212"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KybRequest" }
            examples:
              full:
                value:
                  entityName: ACME Capital Pte Ltd
                  registrationNumber: 201912345A
                  countryOfRegistration: SG
                  referenceId: acme-capital-001
                  assignee: kyb@compliance.com
                  enableReScreening: true
                  enableOnGoingMonitoring: false
      responses:
        "200":
          description: Returns the assigned `systemId` (prefixed `KYB`).
          content:
            text/plain:
              schema: { type: string, example: KYB00212 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/kyb/exchange/query:
    get:
      tags: [KYB]
      summary: Query a KYB record
      operationId: queryKyb
      parameters:
        - name: systemId
          in: query
          schema: { type: string, example: KYB003456 }
        - name: referenceId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching KYB records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KybRecord" }

webhooks:
  kycUpdated:
    post:
      tags: [Webhooks]
      summary: "Webhook: KYC record updated"
      description: |
        Fired when a KYC record changes status, hits a new sanctions list,
        or completes ongoing monitoring.

        ### Signature

        Each webhook is signed with `HMAC-SHA256` using your shared secret.
        The signature is in the `X-Regtank-Signature` header. Recompute it
        as `HMAC-SHA256(secret, timestamp + "." + raw_body)` and reject
        webhooks whose signature does not match or whose timestamp is
        > 5 minutes old.

        ### Retries

        Failed deliveries (non-2xx response or timeout > 10 s) are retried with
        exponential backoff: **1 m, 5 m, 30 m, 2 h, 12 h** — then dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookKyc" }
            example:
              eventType: KYC_UPDATED
              systemId: KYC00121
              referenceId: john.smith@example.com
              status: COMPLETED
              riskLevel: HIGH
              riskScore: 87
              hitLists: [PEP, SANCTIONS_OFAC]
              updatedAt: "2026-05-26T10:00:00Z"
      responses:
        "200":
          description: Acknowledge receipt with a 2xx status.

  kytUpdated:
    post:
      tags: [Webhooks]
      summary: "Webhook: KYT transaction event"
      description: Fired when a monitored wallet sees a new transaction or its risk score changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookKyt" }
            example:
              eventType: KYT_NEW_TRANSACTION
              systemId: KYT00011
              referenceId: jordan@regtank.com
              riskLevel: MEDIUM
              riskScore: 55
              transaction:
                hash: "0x4a9e..."
                amount: "1.2345"
                asset: BTC
                timestamp: "2026-05-26T09:55:12Z"
      responses:
        "200":
          description: Acknowledge receipt.

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth2 client-credentials grant. Token endpoint is on the OAuth host
        (`crm-server.regtank.com`).
      flows:
        clientCredentials:
          tokenUrl: https://crm-server.regtank.com/oauth/token
          scopes:
            read: Read access to your KYC/KYB/KYT records
            write: Submit new screening requests
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Pass the JWT obtained from `/oauth/token` as
        `Authorization: Bearer <token>`. Expires after 1 hour.

  schemas:
    TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          example: client_credentials
        client_id:
          type: string
          format: uuid
          example: a2801714-0e34-4fbb-be74-30e25c544b73
        client_secret:
          type: string
          example: e5555bcff97f86a4d17209443a6456b5

    TokenResponse:
      type: object
      properties:
        access_token: { type: string, description: JWT bearer token. }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3599, description: Seconds until expiry. }
        scope: { type: string, example: "read write" }
        sub: { type: string, example: a2801714-0e34-4fbb-be74-30e25c544b73 }
        jti: { type: string, example: f518893b-b4ca-4ad1-8a7a-dd5c5524d909 }

    Gender:
      type: string
      enum: [MALE, FEMALE, UNSPECIFIED]

    CountryCode:
      type: string
      description: |
        ISO 3166-1 alpha-2 country code, with exceptions:
        - `BU` for Burma
        - `VAT` for Vatican City
      pattern: "^[A-Z]{2,3}$"
      example: US

    KycRequest:
      type: object
      description: |
        Required: at least one of (`surname` + `forename`) **or** `fullname`.
        All other fields are optional but improve match quality.
      properties:
        surname:
          type: string
          maxLength: 100
          description: Individual's last name. Do not use if `fullname` is provided.
          example: Smith
        forename:
          type: string
          maxLength: 100
          description: Individual's first name. Do not use if `fullname` is provided.
          example: John
        middlename:
          type: string
          maxLength: 100
          example: Kelvin
        enableReScreening:
          type: boolean
          default: true
          description: Re-screen this individual when source data is updated.
        enableOnGoingMonitoring:
          type: boolean
          default: false
          description: Push updates via webhook when status changes (requires webhook configured).
        dateOfBirth:
          type: string
          format: date
          example: "1977-12-31"
        yearOfBirth:
          type: integer
          minimum: 1753
          maximum: 9999
          description: Redundant if `dateOfBirth` is supplied.
          example: 1977
        gender: { $ref: "#/components/schemas/Gender" }
        assignee:
          type: string
          format: email
          maxLength: 100
          description: Compliance officer assigned to review this case.
        address1:
          type: string
          maxLength: 255
        address2:
          type: string
          maxLength: 255
        countryOfResidence:
          $ref: "#/components/schemas/CountryCode"
        placeOfBirth:
          $ref: "#/components/schemas/CountryCode"
        nationality:
          $ref: "#/components/schemas/CountryCode"
        idIssuingCountry:
          $ref: "#/components/schemas/CountryCode"
        email:
          type: string
          format: email
          maxLength: 100
        phone:
          type: string
          maxLength: 100
          example: "+1-202-555-0198"
        governmentIdNumber:
          type: string
          maxLength: 100
        referenceId:
          type: string
          maxLength: 100
          description: |
            Your own reference for this case (e.g. user email or UUID).
            Required when ongoing monitoring is enabled, since this is what
            the webhook uses to match the record back to your user.

    KytRequest:
      type: object
      required: [asset, address]
      properties:
        asset:
          type: string
          enum: [BTC, BCH, BNB, LTC, ETH]
          example: BTC
        address:
          type: string
          maxLength: 100
          example: 3Pv7L9EeYyAMcn7U3tTWyKWxFpVJHfQBTa
        referenceId:
          type: string
          maxLength: 100
        assignee:
          type: string
          format: email
          maxLength: 100
        ongoingMonitoring:
          type: object
          properties:
            riskScoreChange: { type: boolean }
            newTransaction: { type: boolean }
        webHookResponse:
          type: boolean
          default: false
          description: Push updates via webhook (requires webhook configured).

    KybRequest:
      type: object
      required: [entityName]
      properties:
        entityName:
          type: string
          maxLength: 200
        registrationNumber:
          type: string
          maxLength: 100
        countryOfRegistration: { $ref: "#/components/schemas/CountryCode" }
        registrationDate:
          type: string
          format: date
        businessType:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 255
        industrySector:
          type: string
          maxLength: 100
        assignee:
          type: string
          format: email
        referenceId:
          type: string
          maxLength: 100
        enableReScreening: { type: boolean, default: true }
        enableOnGoingMonitoring: { type: boolean, default: false }

    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    Status:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED, REJECTED, EXPIRED]

    KycRecord:
      type: object
      properties:
        systemId: { type: string, example: KYC00001 }
        referenceId: { type: string, example: john.smith@example.com }
        surname: { type: string }
        forename: { type: string }
        riskLevel: { $ref: "#/components/schemas/RiskLevel" }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        status: { $ref: "#/components/schemas/Status" }
        assignee: { type: string, format: email }
        hits:
          type: array
          items:
            type: object
            properties:
              listType: { type: string, example: SANCTIONS_OFAC }
              matchScore: { type: integer }
              entityName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KytRecord:
      type: object
      properties:
        systemId: { type: string, example: KYT00001 }
        referenceId: { type: string }
        asset: { type: string }
        address: { type: string }
        riskLevel: { $ref: "#/components/schemas/RiskLevel" }
        riskScore: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        assignee: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    KybRecord:
      type: object
      properties:
        systemId: { type: string, example: KYB003456 }
        referenceId: { type: string }
        entityName: { type: string }
        riskLevel: { $ref: "#/components/schemas/RiskLevel" }
        status: { $ref: "#/components/schemas/Status" }
        directors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              riskLevel: { $ref: "#/components/schemas/RiskLevel" }
        shareholders:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ownershipPercent: { type: number }

    WebhookKyc:
      type: object
      required: [eventType, systemId, status]
      properties:
        eventType:
          type: string
          enum: [KYC_CREATED, KYC_UPDATED, KYC_NEW_HIT]
        systemId: { type: string }
        referenceId: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        riskLevel: { $ref: "#/components/schemas/RiskLevel" }
        riskScore: { type: integer }
        hitLists:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }

    WebhookKyt:
      type: object
      required: [eventType, systemId]
      properties:
        eventType:
          type: string
          enum: [KYT_RISK_CHANGED, KYT_NEW_TRANSACTION]
        systemId: { type: string }
        referenceId: { type: string }
        riskLevel: { $ref: "#/components/schemas/RiskLevel" }
        riskScore: { type: integer }
        transaction:
          type: object
          properties:
            hash: { type: string }
            amount: { type: string }
            asset: { type: string }
            timestamp: { type: string, format: date-time }

    Error:
      type: object
      properties:
        status: { type: string, example: BAD_REQUEST }
        message: { type: string, example: INVALID_PARAMETERS }
        error_code: { type: integer, example: 400 }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
          description: Field-by-field validation messages.

  responses:
    BadRequest:
      description: |
        Invalid request body — at least one field failed validation.
        Inspect the `errors` map for details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Missing or expired access token. Tokens last **1 hour** —
        request a new one from `/oauth/token`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - BearerAuth: []
